  /api/suppressions:
    get:
      operationId: listSuppressions
      tags: [送达事件]
      summary: 抑制列表
      description: |
        收件人抑制列表分页查询（created_at 倒序）。reason：bounce（hard bounce
        事件自动入库）/ complaint（complained 事件自动入库）/ manual（手动添加）。
        命中抑制列表的收件人在所有发送入口被拒（400 invalid_request，
        code=recipient_suppressed）。
      x-auth: 会话 Cookie
      security:
        - sessionCookie: []
      parameters:
        - name: page
          in: query
          required: true
          schema: {type: integer, minimum: 1, default: 1}
        - name: page_size
          in: query
          required: true
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
        - name: reason
          in: query
          schema: {type: string, enum: [bounce, complaint, manual]}
        - name: channel_id
          in: query
          schema: {type: integer, minimum: 1}
        - name: q
          in: query
          description: 邮箱模糊（≤128 字符）
          schema: {type: string, maxLength: 128}
      responses:
        "200":
          description: 抑制列表分页
          content:
            application/json:
              example:
                items:
                  - id: 4
                    email: a@example.com
                    reason: bounce
                    channel_id: 1
                    channel_name: resend主号
                    detail: "原始事件: email.bounced | …"
                    created_at: "2026-11-14T09:00:01Z"
                total: 3
        "400":
          description: 分页/筛选参数非法
        "401":
          $ref: "#/components/responses/UnauthorizedSession"
    post:
      operationId: createSuppression
      tags: [送达事件]
      summary: 手动添加抑制
      description: |
        手动拉黑收件人（reason 恒为 manual；bounce/complaint 仅由事件自动入库）。
        重复添加 → 400。
      x-auth: 会话 Cookie
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {type: string, maxLength: 320, description: 收件邮箱（合法邮箱格式）}
                detail: {type: string, maxLength: 500, description: 备注说明}
            example: {email: gone@example.com, detail: 客户已注销}
      responses:
        "200":
          description: 添加成功（返回抑制记录）
        "400":
          description: email 无效或已在抑制列表
          content:
            application/json:
              example:
                error: {type: invalid_request, message: 该邮箱已在抑制列表中}
        "401":
          $ref: "#/components/responses/UnauthorizedSession"
  /api/suppressions/{id}:
    delete:
      operationId: deleteSuppression
      tags: [送达事件]
      summary: 解除抑制
      description: |
        解除（物理删除该行）。注意：解除的是当前抑制状态而非拉黑豁免——同邮箱
        之后再收到 hard bounce/complaint 事件仍会自动重新入库。
      x-auth: 会话 Cookie
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          description: 抑制记录 ID
          schema: {type: integer, minimum: 1}
      responses:
        "200":
          description: 解除成功
          content:
            application/json:
              example: {ok: true}
        "401":
          $ref: "#/components/responses/UnauthorizedSession"
        "404":
          description: 抑制记录不存在
  /webhooks/mail-events/{token}:
    post:
      operationId: ingestMailEvent
      tags: [送达事件]
      summary: 送达事件入站摄取（公开）
      description: |
        公开无会话鉴权的入站事件端点（送达链路三件套）。URL 中 token 为每渠道
        独立凭据（Channel.webhook_token，管理端点可轮换）。鉴权分层：URL token
        定位渠道（对无签名平台即共享 secret）；带 Svix 签名头（Resend，密钥为
        渠道 webhook_secret 的 whsec_ 串）或 Mailgun 签名字段（timestamp+token+
        signature，密钥为渠道 webhook_secret）时必须验真并防重放。事件归一化为
        sent/delivered/bounced（hard|soft）/complained/raw 存档；hard bounce 与
        complained 按系统设置自动入抑制列表；bounced 触发渠道退信率告警判定。
      x-auth: 渠道 URL token（可选平台签名）
      security: []
      parameters:
        - name: token
          in: path
          required: true
          description: 渠道 webhook token（32 位 hex）
          schema: {type: string, minLength: 32}
      requestBody:
        required: true
        description: 平台事件报文（JSON；Mailgun legacy 兼容 form-urlencoded）
        content:
          application/json:
            examples:
              resend:
                summary: Resend（Svix 信封）
                value:
                  type: email.bounced
                  created_at: "2026-11-14T09:00:00Z"
                  data:
                    email_id: 4ef9a417-02e9-…
                    message_id: "<20261114…@mail.example.com>"
                    to: [a@example.com]
                    bounce: {message: "smtp; 550 5.1.1 user unknown"}
              mailgun:
                summary: Mailgun
                value:
                  event: failed
                  timestamp: 1770146798
                  recipient: a@example.com
                  severity: permanent
                  delivery-status: {code: 550, message: mailbox unavailable}
                  signature: {timestamp: "1770146798", token: e0b5…, signature: 12d9…}
          application/x-www-form-urlencoded:
            schema: {type: object}
      responses:
        "200":
          description: 已摄取（事件已存档或按 raw 兜底）
          content:
            application/json:
              example: {ok: true}
        "400":
          description: 请求体读取失败
        "401":
          description: 签名校验失败或窗口内重放
          content:
            application/json:
              example:
                error: {type: unauthorized, message: webhook 签名校验失败}
        "404":
          description: token 无效（渠道不存在或已轮换）
          content:
            application/json:
              example:
                error: {type: invalid_request, message: webhook 地址无效或已轮换}
  /api/logs:
    get:
      operationId: listLogs
      tags: [发送日志]
