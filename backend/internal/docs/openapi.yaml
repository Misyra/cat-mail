# openapi.yaml CatMail API 规范（B2 内嵌文档）。
# 手写维护，与 SPEC.md 同步更新；由 internal/docs 内嵌并在 /docs 渲染、
# /docs/openapi.yaml 原文直出。示例值均为脱敏占位，不含真实凭据。
openapi: 3.1.0
info:
  title: CatMail API
  version: 1.0.0
  description: |
    CatMail(猫邮) 多渠道邮件轮换发送服务的 HTTP API。

    **鉴权方式**（三组入口互不重叠）：

    - `POST /v1/send` 与 `POST /emails`：`Authorization: Bearer <ApiKey>`
      （「API Key」页创建，`cm-` 前缀，明文仅创建时返回一次）。
    - `/api/*` 管理面：登录签发的会话 Cookie `catmail_session`
      （HMAC 签名、7 天有效、HttpOnly），除登录/登录第二步外全部拦截。
    - `GET /api/health`、`GET /docs`、`GET /docs/openapi.yaml`：公开无鉴权。

    另有两个特殊约束端点：`GET /metrics` 不走会话（抓取器不会登录），仅受管理
    IP 白名单约束；`POST /api/auth/login`（含登录第二步）公开但同样受白名单约束。
    白名单由环境变量 `CATMAIL_ADMIN_CIDR` 配置，未配置时不限制。

    **统一错误体**：非 2xx 响应一律为
    `{ "error": { "type": "<错误类型>", "message": "<人类可读文案>" } }`，
    type 取值见 components.schemas.Error；服务端内部错误只返回通用文案，
    详情不外泄。

    **请求体上限**：发送入口 30MB（容纳 base64 附件），管理面 1MB，超限 400。

    本规范与 SPEC.md 同步维护；如与实现不一致，以代码为准并请反馈修正。
servers:
  - url: /
    description: 同源部署（直连或反向代理）
tags:
  - name: 文档
    description: 内嵌文档页与规范原文（公开）
  - name: 系统
    description: 健康检查与 Prometheus 指标
  - name: 发送
    description: 对外发送入口（Resend SDK 兼容，/emails 为同构别名）
  - name: 认证与会话
    description: 登录、登出、会话信息与本人改密
  - name: 两步验证
    description: TOTP 绑定/启用/解绑（C4）
  - name: 用户
    description: 账号管理（登录用户均为管理员角色，上限 10 个）
  - name: 渠道
    description: 发送渠道管理与直发测试；响应中密钥/代理一律脱敏
  - name: 发送日志
    description: 发送记录查询、详情、CSV 导出与手动清理
  - name: API Key
    description: 调用方密钥管理；明文仅创建时返回一次，列表一律掩码
  - name: 统计
    description: 仪表盘总览与逐日曲线（排除测试发送）
  - name: 更新
    description: 自动更新检查与落盘替换（E8）：CATMAIL_UPDATE_REPO 开启，仅主机部署可用
  - name: 通知
    description: 站内通知中心（失败通知 O9）
  - name: 设置
    description: 系统设置读取/更新与通知通道连通性测试
  - name: 审计
    description: 管理操作审计日志查询（E4）：写操作成功后记录谁/何时/IP/动作/目标
  - name: 数据管理
    description: 整库备份与发送日志手动清理（danger 级操作）
  - name: 送达事件
    description: 送达链路三件套：入站送达事件摄取（公开 webhook）与查询、收件人抑制列表管理
paths:
  /docs:
    get:
      operationId: getDocsPage
      tags: [文档]
      summary: API 文档页（本页）
      description: 单文件 HTML 文档页，公开无鉴权。页面数据为服务端把本规范解析后内嵌的 JSON，零外部依赖；深浅色跟随系统偏好。
      x-auth: 公开
      security: []
      responses:
        "200":
          description: HTML 文档页
          content:
            text/html:
              example: "<!doctype html> …（单文件 HTML）"
  /docs/openapi.yaml:
    get:
      operationId: getDocsSpec
      tags: [文档]
      summary: OpenAPI 规范原文
      description: 本规范的 YAML 原文，公开无鉴权，可下载后导入 OpenAPI 工具链。
      x-auth: 公开
      security: []
      responses:
        "200":
          description: YAML 原文
          content:
            application/yaml:
              example: "openapi: 3.1.0\ninfo: …"
  /api/health:
    get:
      operationId: getHealth
      tags: [系统]
      summary: 健康检查
      description: 公开探针，不校验会话；集成冒烟契约固定返回 {ok:true}。
      x-auth: 公开
      security: []
      responses:
        "200":
          description: 服务正常
          content:
            application/json:
              example: {ok: true}
  /metrics:
    get:
      operationId: getMetrics
      tags: [系统]
      summary: Prometheus 指标
      description: |
        手写 Prometheus 文本暴露格式（version 0.0.4），四族指标：
        catmail_sends_total（全量发送计数，按 channel/provider/status，排除测试发送）、
        catmail_test_sends_total（渠道测试发送计数）、
        catmail_channels（渠道状态 gauge，state: enabled/disabled/cooldown）、
        catmail_notifications_unread（未读通知数）。
        鉴权：不挂会话，仅受管理 IP 白名单（CATMAIL_ADMIN_CIDR）约束；
        未配置白名单时全网可达，生产建议与白名单一同配置收紧。
      x-auth: IP 白名单
      security: []
      responses:
        "200":
          description: 指标文本（空族仍输出 HELP/TYPE 行）
          content:
            text/plain; version=0.0.4; charset=utf-8:
              example: |
                # HELP catmail_sends_total 全量发送计数（按渠道/平台/结果状态，排除测试发送）
                # TYPE catmail_sends_total counter
                catmail_sends_total{channel="主渠道",provider="smtp",status="sent"} 42
                catmail_sends_total{channel="备渠道",provider="resend",status="failed"} 1
                # HELP catmail_test_sends_total 测试发送计数（渠道测试发送 is_test=true，不混入 catmail_sends_total）
                # TYPE catmail_test_sends_total counter
                # HELP catmail_channels 渠道状态（state: enabled/disabled/cooldown，每渠道恒为 1）
                # TYPE catmail_channels gauge
                catmail_channels{channel="主渠道",provider="smtp",state="enabled"} 1
                # HELP catmail_notifications_unread 站内通知未读数
                # TYPE catmail_notifications_unread gauge
                catmail_notifications_unread 0
        "500":
          $ref: "#/components/responses/ServerError"
  /v1/send:
    post:
      operationId: sendMail
      tags: [发送]
      summary: 发送邮件（主入口）
      description: |
        Bearer ApiKey 鉴权；轮换调度（按优先级/轮询、失败换渠道、额度与冷却状态机）。
        可选 Idempotency-Key 幂等防重发（E2）：首次响应被存档，同 Key 重放返回存档响应。
      x-auth: Bearer ApiKey
      security:
        - bearerApiKey: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: 幂等键，≤128 个可见打印 ASCII 字符；不传 = 不启用去重
          schema: {type: string, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, subject]
              properties:
                from:
                  type: string
                  maxLength: 1024
                  description: |
                    发件人，"Name <addr>" 或纯地址。省略时：指定渠道用其默认发件人
                    （渠道也未配置 → 400）；未指定渠道时按各候选渠道默认发件人逐候选回退。
                to:
                  description: 收件人（必填），单个地址字符串或数组；与 cc/bcc 合计 ≤100 项，单项 ≤320 字符
                  oneOf:
                    - {type: string}
                    - {type: array, items: {type: string}}
                subject:
                  type: string
                  maxLength: 998
                  description: 主题（必填）
                html:
                  type: string
                  maxLength: 1048576
                  description: HTML 正文；与 text 至少提供一个非空
                text:
                  type: string
                  maxLength: 1048576
                  description: 纯文本正文
                cc:
                  description: 抄送，形态同 to（可选）
                  oneOf:
                    - {type: string}
                    - {type: array, items: {type: string}}
                bcc:
                  description: 密送，形态同 to（可选）
                  oneOf:
                    - {type: string}
                    - {type: array, items: {type: string}}
                reply_to:
                  description: 回复地址，形态同 to（可选）；接受 camelCase 别名 replyTo
                  oneOf:
                    - {type: string}
                    - {type: array, items: {type: string}}
                headers:
                  type: object
                  additionalProperties: {type: string}
                  description: 自定义邮件头透传（≤50 项，键非空 ≤256 字符、值 ≤4096 字符，键值不得含换行）
                attachments:
                  type: array
                  maxItems: 10
                  items:
                    type: object
                    required: [filename]
                    properties:
                      filename: {type: string, maxLength: 255, description: 文件名（必填）}
                      content_base64: {type: string, description: base64 内容（容忍换行）；content 为其别名}
                tags:
                  type: array
                  maxItems: 20
                  items:
                    type: object
                    required: [name]
                    properties:
                      name: {type: string, description: 标签名（必填）}
                      value: {type: string, description: 标签值}
                channel:
                  type: string
                  maxLength: 128
                  description: 指定发送渠道名（不指定则按轮换规则选路；指定渠道不存在 → 400）
                template_id: {type: integer, minimum: 1, description: 邮件模板 ID（可选扩展）：渲染结果替换 subject/html/text；与 html/text 同时提供 → 400 body_conflict，模板不存在 → 400 unknown_template}
                variables: {type: object, additionalProperties: true, description: 模板渲染变量对象（可选扩展，支持嵌套对象点路径取值）；未提供的变量占位符留空并在响应 missing_variables 字段可见}
            example:
              from: "CatMail <noreply@example.com>"
              to: ["user@example.com"]
              subject: 欢迎注册
              html: "<p>你好，欢迎注册。</p>"
              text: 你好，欢迎注册。
              tags: [{name: type, value: welcome}]
      responses:
        "200":
          description: 已受理（进入轮换调度，含多渠道 failover）
          content:
            application/json:
              example:
                id: 9f8b7c6d-0000-4000-8000-000000000000
                channel: 主渠道
                provider: smtp
                provider_message_id: "<20260101000000.123@example.com>"
                accepted: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/UnauthorizedApiKey"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
        "502":
          $ref: "#/components/responses/ProviderError"
  /emails:
    post:
      operationId: sendMailAlias
      tags: [发送]
      summary: 发送邮件（/v1/send 同构别名）
      description: 与 POST /v1/send 完全同构（Resend SDK 兼容路径）；请求体、鉴权、错误码均一致，仅路径不同。
      x-auth: Bearer ApiKey
      security:
        - bearerApiKey: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: 幂等键，≤128 个可见打印 ASCII 字符；不传 = 不启用去重
          schema: {type: string, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, subject]
              properties:
                from: {type: string, description: 发件人（省略时按渠道默认发件人回退）}
                to:
                  description: 收件人（必填），字符串或数组
                  oneOf:
                    - {type: string}
                    - {type: array, items: {type: string}}
                subject: {type: string, description: 主题（必填）}
                html: {type: string, description: HTML 正文（与 text 至少一个）}
                text: {type: string, description: 纯文本正文}
                cc:
                  description: 抄送（可选）
                  oneOf:
                    - {type: string}
                    - {type: array, items: {type: string}}
                bcc:
                  description: 密送（可选）
                  oneOf:
                    - {type: string}
                    - {type: array, items: {type: string}}
                reply_to:
                  description: 回复地址（可选，别名 replyTo）
                  oneOf:
                    - {type: string}
                    - {type: array, items: {type: string}}
                headers: {type: object, additionalProperties: {type: string}, description: 自定义邮件头}
                attachments:
                  type: array
                  items:
                    type: object
                    properties:
                      filename: {type: string}
                      content_base64: {type: string}
                tags:
                  type: array
                  items:
                    type: object
                    properties:
                      name: {type: string}
                      value: {type: string}
                channel: {type: string, description: 指定渠道名}
                template_id: {type: integer, minimum: 1, description: 邮件模板 ID（可选扩展）：渲染结果替换 subject/html/text；与 html/text 同时提供 → 400 body_conflict，模板不存在 → 400 unknown_template}
                variables: {type: object, additionalProperties: true, description: 模板渲染变量对象（可选扩展，支持嵌套对象点路径取值）；未提供的变量占位符留空并在响应 missing_variables 字段可见}
            example:
              to: user@example.com
              subject: 欢迎注册
              html: "<p>你好，欢迎注册。</p>"
      responses:
        "200":
          description: 已受理
          content:
            application/json:
              example:
                id: 9f8b7c6d-0000-4000-8000-000000000000
                channel: 主渠道
                provider: smtp
                provider_message_id: "<20260101000000.123@example.com>"
                accepted: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/UnauthorizedApiKey"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
        "502":
          $ref: "#/components/responses/ProviderError"
  /api/auth/login:
    post:
      operationId: login
      tags: [认证与会话]
      summary: 登录（第一步）
      description: |
        公开端点（配置 CATMAIL_ADMIN_CIDR 时受管理 IP 白名单约束）。
        凭据校验成功：未启用两步验证 → 签发会话 Cookie 并返回 {username}；
        已启用两步验证 → 不建会话，返回 {totp_required:true, ticket}（5 分钟短票据），
        凭票据调用 POST /api/auth/login/totp 完成第二步。
        登录限流：同一 用户名+IP 组合（及用户名单键）10 分钟窗口内失败 5 次 → 锁定 15 分钟（429）。
      x-auth: 公开
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: {type: string, description: 用户名}
                password: {type: string, description: 密码}
            example: {username: admin, password: "******"}
      responses:
        "200":
          description: 密码正确；未启用两步验证返回 username，已启用返回 ticket
          content:
            application/json:
              examples:
                plain:
                  summary: 未启用两步验证（同时 Set-Cookie 签发会话）
                  value: {username: admin}
                totp:
                  summary: 已启用两步验证（未建会话）
                  value: {totp_required: true, ticket: "t|1767200000|admin|a1b2c3…"}
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: 用户名或密码错误（不存在/密码错/超长凭据同文案，防枚举）
          content:
            application/json:
              example:
                error: {type: unauthorized, message: 用户名或密码错误}
        "429":
          description: 登录失败限流锁定
          content:
            application/json:
              example:
                error: {type: quota_exhausted, message: 尝试次数过多，请稍后再试}
        "500":
          $ref: "#/components/responses/ServerError"
  /api/auth/login/totp:
    post:
      operationId: loginTotp
      tags: [认证与会话]
      summary: 登录第二步（两步验证）
      description: |
        公开端点（同受管理 IP 白名单约束）。code 为 6 位 TOTP 动态码或 10 位恢复码
        （恢复码命中即从库存删除，单次有效）。失败路径（票据无效/过期、码错、账号
        已删除或已解绑）统一 401，与登录失败文案一致。
      x-auth: 公开
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticket, code]
              properties:
                ticket: {type: string, description: 第一步返回的短票据（t|… 格式，5 分钟有效）}
                code: {type: string, description: 6 位动态码或恢复码}
            example: {ticket: "t|1767200000|admin|a1b2c3…", code: "123456"}
      responses:
        "200":
          description: 登录成功（Set-Cookie 签发会话）
          content:
            application/json:
              example: {username: admin}
        "401":
          description: 票据无效或验证码错误
          content:
            application/json:
              example:
                error: {type: unauthorized, message: 用户名或密码错误}
        "429":
          description: 登录失败限流锁定
          content:
            application/json:
              example:
                error: {type: quota_exhausted, message: 尝试次数过多，请稍后再试}
        "500":
          $ref: "#/components/responses/ServerError"
  /api/auth/logout:
    post:
      operationId: logout
      tags: [认证与会话]
      summary: 登出
      description: 清除会话 Cookie。
      x-auth: 会话 Cookie
      security:
        - sessionCookie: []
      responses:
        "200":
          description: 已登出
          content:
            application/json:
              example: {ok: true}
        "401":
          $ref: "#/components/responses/UnauthorizedSession"
  /api/auth/me:
    get:
      operationId: getMe
      tags: [认证与会话]
      summary: 当前会话用户
      description: 返回当前登录用户的 id、用户名与两步验证状态。
      x-auth: 会话 Cookie
      security:
        - sessionCookie: []
      responses:
        "200":
          description: 当前用户
          content:
            application/json:
              example: {id: 1, username: admin, totp_enabled: false}
        "401":
          $ref: "#/components/responses/UnauthorizedSession"
  /api/auth/password:
    put:
      operationId: changeOwnPassword
      tags: [认证与会话]
      summary: 修改本人密码
      description: |
        校验旧密码后更新本人密码（新密码 6-72 字符）。成功后本人 session_epoch+1 并
        重签当前会话 Cookie：当前会话保持登录，本人其他已签发会话（其他浏览器/标签）全部失效。
      x-auth: 会话 Cookie
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [old_password, new_password]
              properties:
                old_password: {type: string, description: 旧密码}
                new_password: {type: string, minLength: 6, maxLength: 72, description: 新密码（6-72 字符）}
            example: {old_password: "******", new_password: "******"}
      responses:
        "200":
          description: 修改成功（响应带重签后的 Set-Cookie）
          content:
            application/json:
              example: {ok: true}
        "400":
          description: 旧密码错误或新密码不合规（至少 6 字符）
          content:
            application/json:
              example:
                error: {type: invalid_request, message: 旧密码错误}
        "401":
          $ref: "#/components/responses/UnauthorizedSession"
  /api/sessions:
    get:
      operationId: listSessions
      tags: [认证与会话]
      summary: 本人活跃会话列表
      description: |
        服务端会话注册表中本人未吊销且未过期的会话（安全加固三件套，C），按最后
        活跃倒序；当前会话带 current 标记。含登录来源 IP 与 User-Agent 快照。
      x-auth: 会话 Cookie
      security:
        - sessionCookie: []
      responses:
        "200":
          description: 会话列表
          content:
            application/json:
              example:
                items:
                  - id: "742a8a29e24f3ceae9930d01971e8aaa"
                    ip: "203.0.113.7"
                    user_agent: "Mozilla/5.0 …"
                    created_at: "2026-01-01T00:00:00+08:00"
                    last_seen_at: "2026-01-01T08:00:00+08:00"
                    expires_at: "2026-01-08T00:00:00+08:00"
                    current: true
        "401":
          $ref: "#/components/responses/UnauthorizedSession"
  /api/sessions/{id}:
    delete:
      operationId: deleteSession
      tags: [认证与会话]
      summary: 踢指定会话
      description: |
        吊销本人指定会话（注册表 revoked_at 置位，旧 token 即时失效）；不能下线
        当前会话（400，请走退出登录）；非本人/不存在/已吊销一律 404（不探测他人
        会话存在性）。不影响 API Key（联动停用仅密码重置触发）。审计 sessions_revoke。
      x-auth: 会话 Cookie
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          description: 会话 ID（GET /api/sessions 返回）
          schema: {type: string, maxLength: 64}
      responses:
        "200":
          description: 已下线
          content:
            application/json:
              example: {ok: true}
        "400":
          description: 目标为当前会话
          content:
            application/json:
              example:
                error: {type: invalid_request, message: 不能下线当前会话（请使用退出登录）}
        "401":
          $ref: "#/components/responses/UnauthorizedSession"
        "404":
          description: 会话不存在或已下线
          content:
            application/json:
              example:
                error: {type: invalid_request, message: 会话不存在或已下线}
  /api/sessions/revoke-others:
    post:
      operationId: revokeOtherSessions
      tags: [认证与会话]
      summary: 下线其余全部会话
      description: |
        吊销本人除当前会话外的全部活跃会话（单条 UPDATE，幂等）；不影响 API Key。
        审计 sessions_revoke（action=revoke_others）。
      x-auth: 会话 Cookie
      security:
        - sessionCookie: []
      responses:
        "200":
          description: 下线完成
          content:
            application/json:
              example: {revoked: 2}
        "401":
          $ref: "#/components/responses/UnauthorizedSession"
  /api/auth/totp/setup:
    post:
      operationId: totpSetup
      tags: [两步验证]
      summary: 开始绑定两步验证
      description: 生成 160bit TOTP secret（base32）并暂存（未生效），返回 secret 与 otpauth_url 供认证器扫码；已启用 → 400。secret 只在本次响应出现。
      x-auth: 会话 Cookie
      security:
        - sessionCookie: []
      responses:
        "200":
          description: 待扫码确认
          content:
            application/json:
              example:
                secret: JBSWY3DPEHPK3PXP
                otpauth_url: "otpauth://totp/CatMail:admin?issuer=CatMail&secret=JBSWY3DPEHPK3PXP"
        "400":
          description: 两步验证已启用
          content:
            application/json:
              example:
                error: {type: invalid_request, message: 两步验证已启用}
        "401":
          $ref: "#/components/responses/UnauthorizedSession"
  /api/auth/totp/enable:
    post:
      operationId: totpEnable
      tags: [两步验证]
      summary: 确认启用两步验证
      description: |
        凭 6 位动态码确认绑定（±1 窗口容差）。成功后生成 8 个恢复码（明文仅本次响应
        返回，此后任何接口不再返回）；本人 session_epoch+1 并重签当前会话 Cookie。
      x-auth: 会话 Cookie
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: {type: string, description: 认证器当前 6 位动态码}
            example: {code: "123456"}
      responses:
        "200":
          description: 启用成功
          content:
            application/json:
              example:
                recovery_codes: ["ABCD23EF45", "GH56IJ78KL", "MN90OP12QR", "ST34UV56WX", "YZ78AB90CD", "EF12GH34IJ", "KL56MN78OP", "QR90ST12UV"]
        "400":
          description: 未先 setup / 已启用 / 验证码为空
          content:
            application/json:
              example:
                error: {type: invalid_request, message: 请先开始绑定}
        "401":
          description: 验证码错误
          content:
            application/json:
              example:
                error: {type: unauthorized, message: 验证码错误}
  /api/auth/totp/disable:
    post:
      operationId: totpDisable
      tags: [两步验证]
      summary: 解绑两步验证
      description: 凭当前登录密码解绑（不用动态码——手机丢失也可解绑）；清空 secret 与恢复码，本人 session_epoch+1 并重签当前会话。
      x-auth: 会话 Cookie
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: {type: string, description: 当前登录密码}
            example: {password: "******"}
      responses:
        "200":
          description: 解绑成功
          content:
            application/json:
              example: {ok: true}
        "400":
          description: 未启用两步验证或密码错误
          content:
            application/json:
              example:
                error: {type: invalid_request, message: 密码错误}
        "401":
          $ref: "#/components/responses/UnauthorizedSession"
  /api/users:
    get:
      operationId: listUsers
      tags: [用户]
