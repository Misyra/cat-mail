    post:
      operationId: createChannel
      tags: [渠道]
      summary: 创建渠道
      description: |
        name 必填（1-128 字符，唯一）、provider 必填（合法平台适配器名）；
        smtp 渠道必须配置 from_email/smtp_host/有效端口，mailgun 渠道必须配置 domain。
        字段约束：proxy_url 仅 http:// 或 socks5://；region 仅 us/eu；smtp_tls 仅
        none/starttls/tls；额度覆盖与限速不能为负。秘钥类字段（api_key/api_secret/
        proxy_url/smtp_pass）创建时按提供值写入。
      x-auth: 会话 Cookie
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, provider]
              properties:
                name: {type: string, description: 渠道名（1-128 字符，唯一）}
                provider: {type: string, description: 平台适配器名（如 smtp/resend/mailgun/sendgrid 等）}
                priority: {type: integer, description: 优先级（越小越优先）}
                api_key: {type: string, description: 平台 API Key}
                api_secret: {type: string, description: 平台 API Secret}
                domain: {type: string, description: 发送域名（mailgun 必填）}
                region: {type: string, enum: [us, eu, ""], description: 区域（部分平台）}
                proxy_url: {type: string, description: 出站代理 http:// 或 socks5://（含凭据时响应中打码）}
                allowed_domains: {type: string, description: 允许的收件域名白名单（逗号分隔，空=不限）}
                from_email: {type: string, description: 默认发件人邮箱}
                from_name: {type: string, description: 默认发件人名}
                smtp_host: {type: string, description: SMTP 主机}
                smtp_port: {type: integer, description: SMTP 端口（1-65535）}
                smtp_user: {type: string, description: SMTP 用户名}
                smtp_pass: {type: string, description: SMTP 密码}
                smtp_tls: {type: string, enum: [none, starttls, tls, ""], description: TLS 模式}
                daily_limit_override: {type: integer, description: 日额度覆盖（0=用平台默认）}
                monthly_limit_override: {type: integer, description: 月额度覆盖（0=用平台默认）}
                rate_limit_per_sec: {type: integer, description: 出站限速（封/秒，0=不限）}
            example:
              name: 主渠道
              provider: smtp
              priority: 10
              from_email: noreply@example.com
              from_name: CatMail
              smtp_host: smtp.example.com
              smtp_port: 465
              smtp_user: noreply@example.com
              smtp_pass: "******"
              smtp_tls: tls
      responses:
        "200":
          description: 创建成功（响应结构同列表项，health 为 null）
          content:
            application/json:
              example:
                id: 2
                name: 主渠道
                provider: smtp
                status: 0
                priority: 10
                smtp_pass: "****"
                effective_daily_limit: 500
                effective_monthly_limit: 10000
                used_day: 0
                used_month: 0
                health: null
        "400":
          description: 校验失败（重名/未知平台/渠道参数缺失等）
          content:
            application/json:
              example:
                error: {type: invalid_request, message: 渠道名称已存在}
        "401":
          $ref: "#/components/responses/UnauthorizedSession"
  /api/channels/{id}:
    put:
      operationId: updateChannel
      tags: [渠道]
      summary: 更新渠道（部分更新）
      description: |
        全部字段可选：省略字段=保留原值；非秘钥字符串字段传空串=显式清空；
        秘钥类字段（api_key/api_secret/proxy_url/smtp_pass）传空串=保留原值
        （防回显掩码误清凭据），需清空时用 clear_secrets 显式声明。更新成功后
        status 复位为启用、连续失败/最近错误/自动禁用原因清空、冷却解除。
      x-auth: 会话 Cookie
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          description: 渠道 ID
          schema: {type: integer, minimum: 1}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string, description: 渠道名（1-128 字符，唯一）}
                provider: {type: string, description: 平台适配器名}
                priority: {type: integer, description: 优先级}
                api_key: {type: string, description: 平台 API Key（空串=保留原值）}
                api_secret: {type: string, description: 平台 API Secret（空串=保留原值）}
                domain: {type: string, description: 发送域名}
                region: {type: string, description: 区域 us/eu}
                proxy_url: {type: string, description: 出站代理（空串=保留原值）}
                allowed_domains: {type: string, description: 收件域名白名单}
                from_email: {type: string, description: 默认发件人邮箱}
                from_name: {type: string, description: 默认发件人名}
                smtp_host: {type: string, description: SMTP 主机}
                smtp_port: {type: integer, description: SMTP 端口}
                smtp_user: {type: string, description: SMTP 用户名}
                smtp_pass: {type: string, description: SMTP 密码（空串=保留原值）}
                smtp_tls: {type: string, description: TLS 模式 none/starttls/tls}
                daily_limit_override: {type: integer, description: 日额度覆盖}
                monthly_limit_override: {type: integer, description: 月额度覆盖}
                rate_limit_per_sec: {type: integer, description: 出站限速（封/秒）}
                clear_secrets:
                  type: array
                  items: {type: string, enum: [api_key, api_secret, proxy_url, smtp_pass]}
                  description: 显式清除的秘钥字段（仅 PUT 生效）；同字段传非空新值时新值生效
            example:
              priority: 5
              smtp_pass: "******"
      responses:
        "200":
          description: 更新成功（脱敏响应同列表项）
