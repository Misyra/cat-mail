                    provider: smtp
                    status: 0
                    priority: 10
                    api_key: ""
                    api_secret: ""
                    domain: ""
                    region: ""
                    proxy_url: ""
                    allowed_domains: ""
                    from_email: noreply@example.com
                    from_name: CatMail
                    smtp_host: smtp.example.com
                    smtp_port: 465
                    smtp_user: noreply@example.com
                    smtp_pass: "****"
                    smtp_tls: tls
                    daily_limit_override: 0
                    monthly_limit_override: 0
                    rate_limit_per_sec: 0
