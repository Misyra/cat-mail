            application/json:
              example:
                id: 42
                message_id: 9f8b7c6d-0000-4000-8000-000000000000
                api_key_id: 1
                channel_id: 1
                channel_name: 主渠道
                provider: smtp
                is_test: false
                status: 1
                from_addr: noreply@example.com
                to_addrs: [user@example.com]
                subject: 欢迎注册
                provider_message_id: "<20260101000000.123@example.com>"
                error: ""
                attempts: 1
                latency_ms: 310
                created_at: "2026-11-12T09:30:00+08:00"
                html_body: "<p>你好，欢迎注册。</p>"
                text_body: 你好，欢迎注册。
        "401":
          $ref: "#/components/responses/UnauthorizedSession"
        "404":
