                items:
                  - id: 42
                    message_id: 9f8b7c6d-0000-4000-8000-000000000000
                    api_key_id: 1
                    channel_id: 1
                    channel_name: 主渠道
                    provider: smtp
                    is_test: false
                    status: 1
                    from_addr: noreply@example.com
                    to_addrs: [user@example.com]
                    subject: 欢迎注册
                    provider_message_id: "<20260101000000.123@example.com>"
                    error: ""
                    attempts: 1
                    latency_ms: 310
                    created_at: "2026-11-12T09:30:00+08:00"
                total: 1
        "400":
          description: 分页/筛选/排序参数非法
          content:
            application/json:
              example:
                error: {type: invalid_request, message: sort 仅支持 newest/oldest/latency_desc}
        "401":
          $ref: "#/components/responses/UnauthorizedSession"
  /api/logs/export:
    get:
      operationId: exportLogs
      tags: [发送日志]
      summary: 导出发送日志 CSV
      description: |
        查询参数与列表一致（page/page_size 忽略），流式输出 CSV 下载：
        Content-Type text/csv; charset=utf-8，文件名 catmail-logs-<UTC时间戳>.csv，
        开头带 UTF-8 BOM（Excel 中文兼容）；行数上限 10000，达到上限在末尾追加备注行；
        以 = + - @ 开头的单元格前置单引号（CSV 公式注入防护）。
      x-auth: 会话 Cookie
      security:
        - sessionCookie: []
      parameters:
        - name: status
          in: query
          required: false
          schema: {type: string, enum: [sent, failed, pending, ""]}
          description: 按状态筛选
        - {name: channel_id, in: query, required: false, schema: {type: integer, minimum: 1}, description: 按渠道筛选}
        - {name: q, in: query, required: false, schema: {type: string, maxLength: 128}, description: 关键词模糊匹配}
        - {name: sort, in: query, required: false, schema: {type: string, enum: [newest, oldest, latency_desc]}, description: 排序}
      responses:
        "200":
          description: CSV 文件（附件下载）
          content:
            text/csv:
              example: |
                时间,状态,渠道,平台,发件人,收件人,主题,耗时ms,测试,错误信息,消息ID,备注
                "2026-11-12T09:30:00+08:00",sent,主渠道,smtp,noreply@example.com,user@example.com,欢迎注册,310,no,,9f8b7c6d,…,
        "400":
          description: 筛选/排序参数非法
          content:
            application/json:
              example:
                error: {type: invalid_request, message: status 仅支持 sent/failed/pending}
        "401":
          $ref: "#/components/responses/UnauthorizedSession"
  /api/logs/purge:
    post:
      operationId: purgeLogs
      tags: [发送日志]
      summary: 手动清理发送日志
      description: |
        danger 级操作（前端二次确认，服务端记录审计日志）。三种模式：
        before_days=删除早于 N 天前的日志（days 1-3650）、channel=删除指定渠道全部日志
        （channel_id 必填）、all=清空全部发送日志。分批删除（每批 500 条）避免长事务。
      x-auth: 会话 Cookie
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: {type: string, enum: [before_days, channel, all], description: 清理模式}
                days: {type: integer, minimum: 1, maximum: 3650, description: mode=before_days 时必填}
                channel_id: {type: integer, minimum: 1, description: mode=channel 时必填}
            example: {mode: before_days, days: 90}
      responses:
        "200":
          description: 清理完成
          content:
            application/json:
              example: {deleted: 128}
        "400":
          description: mode 非法或 days/channel_id 缺失
          content:
            application/json:
              example:
                error: {type: invalid_request, message: mode 仅支持 before_days/channel/all}
        "401":
          $ref: "#/components/responses/UnauthorizedSession"
  /api/logs/{id}:
    get:
