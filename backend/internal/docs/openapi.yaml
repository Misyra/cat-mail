              properties:
                username: {type: string, minLength: 2, maxLength: 32, description: 用户名（2-32 字符，唯一）}
                password: {type: string, minLength: 6, maxLength: 72, description: 密码（6-72 字符）}
            example: {username: ops, password: "******"}
      responses:
        "200":
          description: 创建成功
          content:
            application/json:
              example: {id: 2, username: ops, created_at: "2026-11-12T00:00:00+08:00"}
        "400":
          description: 校验失败（长度/重名/已达上限）
          content:
            application/json:
              example:
                error: {type: invalid_request, message: 用户名已存在}
        "401":
          $ref: "#/components/responses/UnauthorizedSession"
  /api/users/{id}/password:
    put:
      operationId: resetUserPassword
      tags: [用户]
      summary: 重置指定账号密码
      description: 新密码 6-72 字符。成功后目标用户 session_epoch+1，其全部已签发会话立即失效；操作者与其他用户会话不受影响。
      x-auth: 会话 Cookie
      security:
        - sessionCookie: []
      parameters:
        - name: id
