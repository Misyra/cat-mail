        - {name: page_size, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 20}, description: 每页条数}
        - name: status
          in: query
          required: false
          schema: {type: string, enum: [sent, failed, pending, ""]}
          description: 按状态筛选（空=全部）
        - {name: channel_id, in: query, required: false, schema: {type: integer, minimum: 1}, description: 按渠道筛选}
        - {name: q, in: query, required: false, schema: {type: string, maxLength: 128}, description: 关键词模糊匹配 subject 与收件人}
        - {name: sort, in: query, required: false, schema: {type: string, enum: [newest, oldest, latency_desc], default: newest}, description: 排序}
      responses:
        "200":
          description: 日志分页列表
