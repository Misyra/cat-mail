          content:
            application/json:
              example:
                error: {type: invalid_request, message: 缺少有效收件邮箱 to}
        "401":
          $ref: "#/components/responses/UnauthorizedSession"
        "404":
          description: 渠道不存在
          content:
            application/json:
              example:
                error: {type: invalid_request, message: 渠道不存在}
        "429":
          description: 渠道额度已用尽
          content:
            application/json:
              example:
                error: {type: quota_exhausted, message: 渠道当日/当月额度已用尽，测试发送未执行}
  /api/channels/{id}/duplicate:
    post:
      operationId: duplicateChannel
      tags: [渠道]
      summary: 复制渠道
      description: |
        读原渠道全字段（含 secrets，服务端原样复制、响应仍脱敏）新建副本：
        副本名 = 原名-副本（重名依次追加 -2/-3）；副本默认手动停用（防止与原渠道
        并存时意外上线）；运行态归零（用量/锚点/连续失败/最近错误/冷却/自动禁用
        原因/最近使用时间）。无请求体。
      x-auth: 会话 Cookie
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          description: 源渠道 ID
          schema: {type: integer, minimum: 1}
      responses:
        "200":
          description: 复制成功（响应结构同创建接口，health 为 null）
          content:
            application/json:
              example:
                id: 3
                name: 主渠道-副本
                provider: smtp
                status: 1
                priority: 10
                smtp_pass: "****"
                used_day: 0
                used_month: 0
                health: null
        "400":
          description: 副本名超长或并发重名冲突
          content:
            application/json:
              example:
                error: {type: invalid_request, message: 渠道名称已存在}
        "401":
          $ref: "#/components/responses/UnauthorizedSession"
        "404":
          description: 渠道不存在
          content:
            application/json:
              example:
                error: {type: invalid_request, message: 渠道不存在}
        "500":
          $ref: "#/components/responses/ServerError"
  /api/channels/{id}/webhook-token:
    post:
      operationId: rotateChannelWebhookToken
      tags: [渠道]
      summary: 渠道入站 webhook token 补生成/轮换
      description: |
        送达链路三件套：存量渠道（webhook_token 为空的升级旧行）首次调用补生成
        token；body rotate=true 时强制轮换，旧 URL 立即失效（平台侧需更新 webhook
        地址）。空请求体等价 rotate=false（仅补生成）。
      x-auth: 会话 Cookie
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          description: 渠道 ID
          schema: {type: integer, minimum: 1}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                rotate: {type: boolean, default: false, description: true=强制轮换}
      responses:
        "200":
          description: 返回 token 与相对路径 webhook 地址
          content:
            application/json:
              example:
                webhook_token: 9f2c…（32 位 hex）
                webhook_url: /webhooks/mail-events/<token>
        "400":
          description: 请求体格式错误
        "401":
          $ref: "#/components/responses/UnauthorizedSession"
        "404":
          description: 渠道不存在
          content:
            application/json:
              example:
                error: {type: invalid_request, message: 渠道不存在}
        "500":
          $ref: "#/components/responses/ServerError"
  /api/mail-events:
    get:
      operationId: listMailEvents
      tags: [送达事件]
      summary: 送达事件列表
      description: |
        入站送达事件分页列表（occurred_at 倒序，不含 raw 大字段）。事件为归一化
        口径：sent/delivered/bounced（bounce_type=hard|soft）/complained/raw。
      x-auth: 会话 Cookie
      security:
        - sessionCookie: []
      parameters:
        - name: page
          in: query
          required: true
          schema: {type: integer, minimum: 1, default: 1}
        - name: page_size
          in: query
          required: true
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
        - name: event
          in: query
          schema: {type: string, enum: [sent, delivered, bounced, complained, raw]}
        - name: bounce_type
          in: query
          schema: {type: string, enum: [hard, soft]}
        - name: channel_id
          in: query
          schema: {type: integer, minimum: 1}
        - name: q
          in: query
          description: 收件人模糊（≤128 字符）
          schema: {type: string, maxLength: 128}
      responses:
        "200":
          description: 事件分页列表
          content:
            application/json:
              example:
                items:
                  - id: 12
                    channel_id: 1
                    channel_name: resend主号
                    provider: resend
                    event: bounced
                    bounce_type: hard
                    provider_message_id: 4ef9a417-02e9-…
                    message_id: 9c1e…（关联 SendLog.MessageID，未解析为空）
                    send_log_id: 88
                    recipient: a@example.com
                    detail: "原始事件: email.bounced | smtp; 550 5.1.1 user unknown"
                    occurred_at: "2026-11-14T09:00:00Z"
                    created_at: "2026-11-14T09:00:01Z"
                total: 120
        "400":
          description: 分页/筛选参数非法
        "401":
          $ref: "#/components/responses/UnauthorizedSession"
  /api/mail-events/{id}:
    get:
      operationId: getMailEvent
      tags: [送达事件]
      summary: 送达事件详情
      description: 完整详情（含 raw 原始报文，JSON 透传；非法 JSON 报文回退为字符串值）。
      x-auth: 会话 Cookie
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
