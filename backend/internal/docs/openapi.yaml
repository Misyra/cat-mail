      x-auth: 会话 Cookie
      security:
        - sessionCookie: []
      responses:
        "200":
          description: 用户列表
          content:
            application/json:
              example:
                items:
                  - {id: 1, username: admin, created_at: "2026-01-01T00:00:00+08:00"}
        "401":
          $ref: "#/components/responses/UnauthorizedSession"
    post:
      operationId: createUser
      tags: [用户]
      summary: 新建账号
      description: 用户名 2-32 字符、密码 6-72 字符；重名 400；账号总数上限 10 个。
      x-auth: 会话 Cookie
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
