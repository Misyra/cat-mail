          content:
            application/json:
              example:
                error: {type: invalid_request, message: 日志不存在}
  /api/logs/{id}/resend:
    post:
      operationId: resendLog
      tags: [发送日志]
      summary: 按日志重发邮件
      description: |
        按日志快照（from/to/subject/html/text）原样重发一封邮件，走正常轮换
        （不指定渠道，由当前可用渠道送出），生成新 message_id 并落一条 is_test=false
        新日志；headers/附件/标签不在快照内，重发不含。正文缺失（隐私开关历史行）
        → 400。防滥用：同一日志 30 秒内仅允许重发一次（429 quota_exhausted）。
        无请求体。
      x-auth: 会话 Cookie
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          description: 日志 ID
          schema: {type: integer, minimum: 1}
      responses:
        "200":
          description: 重发已受理（响应结构同发送接口）
          content:
            application/json:
              example:
                id: b1a2c3d4-0000-4000-8000-000000000001
                channel: 主渠道
                provider: smtp
                provider_message_id: "<20260101000001.456@example.com>"
                accepted: true
        "400":
          description: 日志未记录正文或缺少收件人
          content:
            application/json:
              example:
                error: {type: invalid_request, message: 该日志未记录正文，无法重发}
        "401":
          $ref: "#/components/responses/UnauthorizedSession"
        "404":
          description: 日志不存在
          content:
            application/json:
              example:
                error: {type: invalid_request, message: 日志不存在}
        "429":
          description: 30 秒重发闸 / 轮换无可用渠道
          content:
            application/json:
              example:
                error: {type: quota_exhausted, message: 该日志 30 秒内已重发过，请稍后再试}
        "500":
          $ref: "#/components/responses/ServerError"
        "502":
          $ref: "#/components/responses/ProviderError"
  /api/keys:
    get:
      operationId: listKeys
      tags: [API Key]
      summary: Key 列表
      description: |
        key 一律掩码（cm-abcd…wxyz）；webhook_url/webhook_events 为调用方回执配置
        （URL 非凭据，明文回显）；daily_quota/rate_per_sec 为调用方维度配额与限速
        （0=不限）；total_sent 为该 key 发送成功总数（含测试发送）。
      x-auth: 会话 Cookie
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Key 列表
          content:
            application/json:
              example:
                items:
                  - id: 1
                    name: 业务系统
                    masked_key: cm-abcd…wxyz
                    enabled: true
                    webhook_url: "https://cb.example.com/hook"
                    webhook_events: send_accepted,send_failed
                    daily_quota: 0
                    rate_per_sec: 0
