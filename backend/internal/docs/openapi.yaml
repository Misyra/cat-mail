              examples:
                ok:
                  summary: 双通道正常
                  value: {inapp_ok: true, webhook_ok: true, webhook_error: ""}
                webhookFail:
                  summary: Webhook 失败
                  value: {inapp_ok: true, webhook_ok: false, webhook_error: "post https://…: connection refused"}
        "401":
          $ref: "#/components/responses/UnauthorizedSession"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/settings/notify/webhook-secret:
    post:
      operationId: rotateNotifyWebhookSecret
      tags: [设置]
      summary: 通知 Webhook 签名密钥生成/轮换
      description: |
        生成或轮换通知 Webhook 的签名密钥（32 字节随机 hex，安全加固三件套，B），
        返回新值供设置卡片展示/复制。rotate=false（缺省）仅在未配置时生成；
        rotate=true 强制轮换。PUT /api/settings 忽略 notify_webhook_secret 字段，
        变更仅经本端点。轮换后存量未投递的 outbox 通知任务按新值签名。secret 值
        不入审计（审计动作 settings_webhook_secret）。
      x-auth: 会话 Cookie
      security:
        - sessionCookie: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                rotate: {type: boolean, default: false, description: true=强制轮换；false=仅在未配置时生成}
      responses:
        "200":
          description: 当前生效的签名密钥
          content:
            application/json:
              example: {webhook_secret: "9c1e…（64 位 hex）"}
        "401":
          $ref: "#/components/responses/UnauthorizedSession"
  /api/webhook-deliveries:
    get:
      operationId: listWebhookDeliveries
      tags: [设置]
      summary: Webhook 投递记录列表
      description: |
        outbox 投递档案分页列表（安全加固三件套，B，id 倒序）供排查：通知 webhook
        与调用方回执统一落 webhook_deliveries 表后由 scheduler 每分钟驱动投递
        （指数退避 1m→5m→30m→2h→8h→24h 封顶，10 次失败转 dead，dead 保留最近
        100 条）。不含 payload 大字段。
      x-auth: 会话 Cookie
      security:
        - sessionCookie: []
      parameters:
        - {name: page, in: query, required: false, schema: {type: integer, minimum: 1, default: 1}, description: 页码}
        - {name: page_size, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 20}, description: 每页条数}
        - {name: status, in: query, required: false, schema: {type: string, enum: [pending, sent, dead]}, description: 状态筛选}
        - {name: event_type, in: query, required: false, schema: {type: string, maxLength: 64}, description: 事件类型精确筛选}
      responses:
        "200":
          description: 投递记录分页列表
          content:
            application/json:
              example:
                items:
                  - id: 12
                    event_type: send_failed
                    url: "https://open.feishu.cn/open-apis/bot/v2/hook/xxx"
                    secret_ref: "settings:notify_webhook_secret"
                    attempts: 3
                    status: pending
                    last_error: "投递失败: 502 Bad Gateway"
                    next_retry_at: "2026-01-01T08:30:00+08:00"
                    created_at: "2026-01-01T08:00:00+08:00"
                    updated_at: "2026-01-01T08:06:00+08:00"
                total: 1
        "400":
          description: status 取值非法
          content:
            application/json:
              example:
                error: {type: invalid_request, message: status 仅支持 pending/sent/dead}
        "401":
          $ref: "#/components/responses/UnauthorizedSession"
  /api/audit:
    get:
      operationId: listAuditLogs
      tags: [审计]
      summary: 审计日志列表
      description: |
        管理操作审计分页列表（E4，created_at/id 倒序）。渠道/Key/账号的系统设置、
        发送日志清理与备份管理写操作在**成功后**各记一条（失败不记）；detail 只含
        字段名/计数等非敏感摘要，密码、API Key 明文、渠道秘钥一律不入审计。
        保留最近 5000 条（每小时定时裁剪）。
      x-auth: 会话 Cookie
      security:
        - sessionCookie: []
      parameters:
        - {name: page, in: query, required: false, schema: {type: integer, minimum: 1, default: 1}, description: 页码}
        - {name: page_size, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 20}, description: 每页条数}
        - {name: action, in: query, required: false, schema: {type: string, maxLength: 64}, description: 动作前缀筛选（如 channel 命中全部 channel_* 动作；转义 LIKE 通配符）}
        - {name: username, in: query, required: false, schema: {type: string, maxLength: 64}, description: 操作者精确筛选}
      responses:
        "200":
          description: 审计分页列表
          content:
            application/json:
              example:
                items:
                  - id: 9
                    username: admin
                    action: channel_create
                    target: "channel#3 name=示例渠道"
                    detail: "provider=mock priority=0"
                    ip: "192.168.1.10"
                    created_at: "2026-11-12T08:00:00+08:00"
                total: 9
        "400":
          description: 分页/筛选参数非法
          content:
            application/json:
              example:
                error: {type: invalid_request, message: page_size 必须为 1-100 的整数}
        "401":
          $ref: "#/components/responses/UnauthorizedSession"
  /api/update/check:
    get:
      operationId: updateCheck
      tags: [更新]
      summary: 检查自动更新
      description: |
        查询 GitHub Releases 最新版本并与当前版本比较（E8）。结果进程内缓存 1 小时。
        update_available 为手写受限 semver 比较结果（去 v 前缀、按 "." 分段数字比较、
        位数不齐补 0）；任一侧解析失败视为不可比，如实返回 update_available=false 并
        在 error 中说明。GitHub 网络/限流错误不视为服务器故障：HTTP 200 + error 字段
        如实返回（不缓存错误）。in_docker=true 时 apply 恒拒绝，前端应隐藏一键更新。
        需配置 CATMAIL_UPDATE_REPO（owner/repo），未配置返回 400。
      x-auth: 会话 Cookie
      security:
        - sessionCookie: []
      responses:
        "200":
          description: 检查结果（GitHub 失败时 error 非空，其余字段降级）
          content:
            application/json:
              examples:
                updateAvailable:
                  summary: 发现新版本
                  value:
                    current: v1.2.0
                    latest: v1.3.0
                    update_available: true
                    release_url: https://github.com/owner/catmail/releases/tag/v1.3.0
                    notes: "本次更新内容……"
                    published_at: "2026-11-01T08:00:00Z"
                    checked_at: "2026-11-12T08:00:00+08:00"
                    in_docker: false
                upToDate:
                  summary: 已是最新
                  value:
                    current: v1.3.0
                    latest: v1.3.0
                    update_available: false
                    release_url: https://github.com/owner/catmail/releases/tag/v1.3.0
                    checked_at: "2026-11-12T08:00:00+08:00"
                    in_docker: false
                githubError:
                  summary: GitHub 网络/限流失败（如实返回，不缓存）
                  value:
                    current: v1.3.0
                    update_available: false
                    checked_at: "2026-11-12T08:00:00+08:00"
                    in_docker: false
                    error: "GitHub API 限流（匿名额度已用尽，约 1 小时后恢复）"
        "400":
          description: 功能未启用（未配置 CATMAIL_UPDATE_REPO）
          content:
            application/json:
              example:
                error: {type: invalid_request, message: "自动更新未启用（未配置 CATMAIL_UPDATE_REPO）"}
        "401":
          $ref: "#/components/responses/UnauthorizedSession"
  /api/update/apply:
    post:
      operationId: updateApply
      tags: [更新]
      summary: 一键更新（下载并原子替换当前可执行文件）
      description: |
        下载当前平台 release 资产（命名约定 catmail_<os>_<arch>，Windows 追加 .exe）
        与 checksums.txt，SHA-256 强校验后写入当前可执行文件同目录临时文件（fsync）
        再 rename 原子替换；重启进程后生效。安全约束（拒绝即 400）：
        容器部署（/.dockerenv 或 CATMAIL_IN_DOCKER=1，请拉取新镜像升级）；
        Windows（运行中 exe 无法 rename，返回手动替换指引）；
        release 缺少 checksums.txt（缺校验文件没有完整性依据，宁拒勿装）；
        SHA-256 不匹配（绝不落盘）；磁盘剩余空间 < 2× 更新包大小；已有更新进行中。
        成功返回 {ok, installed_version, hint}，重启 catmail 生效。
      x-auth: 会话 Cookie
      security:
        - sessionCookie: []
      responses:
        "200":
          description: 已安装更新（重启生效）
          content:
            application/json:
              example:
                ok: true
                installed_version: v1.3.0
                hint: 重启 catmail 生效，可用 catmail doctor 验证
        "400":
          description: 环境不支持或校验失败（容器/Windows/缺校验文件/校验不匹配/磁盘不足/并发更新/已是最新）
          content:
            application/json:
              examples:
                docker:
                  summary: 容器部署
                  value:
                    error: {type: invalid_request, message: "检测到容器部署，请通过拉取新镜像升级（docker pull 后重建容器），不支持文件级自更新"}
                noChecksum:
                  summary: 缺少校验文件
                  value:
                    error: {type: invalid_request, message: "缺少校验文件 checksums.txt，拒绝更新"}
        "401":
          $ref: "#/components/responses/UnauthorizedSession"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/backups:
    get:
      operationId: listBackups
      tags: [数据管理]
      summary: 备份列表
      description: 整库备份文件列表（name/size/created_at，按时间倒序）；尚无备份时返回空列表。
      x-auth: 会话 Cookie
      security:
        - sessionCookie: []
      responses:
        "200":
          description: 备份列表
          content:
            application/json:
              example:
                items:
                  - {name: catmail-backup-20261112-030000.db, size: 1048576, created_at: "2026-11-12T03:00:00+08:00"}
        "401":
          $ref: "#/components/responses/UnauthorizedSession"
    post:
      operationId: createBackup
      tags: [数据管理]
      summary: 创建备份
      description: |
        SQLite VACUUM INTO 生成整库快照到数据目录 backups/ 下，并裁剪仅保留最近 10 份；
        服务端记录操作审计日志。恢复方式见部署文档。
      x-auth: 会话 Cookie
      security:
        - sessionCookie: []
      responses:
        "200":
          description: 备份完成
          content:
            application/json:
              example: {name: catmail-backup-20261112-030000.db, size: 1048576}
        "401":
          $ref: "#/components/responses/UnauthorizedSession"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/backups/{name}/download:
    get:
      operationId: downloadBackup
      tags: [数据管理]
      summary: 下载备份文件
      description: name 严格白名单（正则 catmail-backup-\d{8}-\d{6}\.db），不含路径分隔符，无路径穿越面；以附件形式直出文件。
      x-auth: 会话 Cookie
      security:
        - sessionCookie: []
      parameters:
        - name: name
          in: path
          required: true
          description: 备份文件名（白名单格式）
          schema: {type: string, pattern: "^catmail-backup-[0-9]{8}-[0-9]{6}\\.db$"}
      responses:
        "200":
          description: 备份文件（application/octet-stream 附件）
          content:
            application/octet-stream:
              example: "<SQLite 二进制内容>"
        "400":
          description: 文件名不符合白名单
          content:
            application/json:
              example:
                error: {type: invalid_request, message: 无效的备份文件名}
        "401":
          $ref: "#/components/responses/UnauthorizedSession"
        "404":
          description: 备份文件不存在
          content:
            application/json:
              example:
                error: {type: invalid_request, message: 备份文件不存在}
  /api/backups/{name}:
    delete:
      operationId: deleteBackup
      tags: [数据管理]
      summary: 删除备份
      description: 删除指定备份文件（name 同下载白名单）；服务端记录审计日志。
      x-auth: 会话 Cookie
      security:
        - sessionCookie: []
      parameters:
        - name: name
          in: path
          required: true
          description: 备份文件名（白名单格式）
          schema: {type: string, pattern: "^catmail-backup-[0-9]{8}-[0-9]{6}\\.db$"}
      responses:
        "200":
          description: 删除成功
          content:
            application/json:
              example: {ok: true}
        "400":
          description: 文件名不符合白名单
          content:
            application/json:
              example:
                error: {type: invalid_request, message: 无效的备份文件名}
        "401":
          $ref: "#/components/responses/UnauthorizedSession"
        "404":
          description: 备份文件不存在
          content:
            application/json:
              example:
                error: {type: invalid_request, message: 备份文件不存在}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: catmail_session
      description: 登录签发的 HMAC 会话 Cookie（7 天有效，HttpOnly；配置 CATMAIL_COOKIE_SECURE 时附加 Secure）
    bearerApiKey:
      type: http
      scheme: bearer
      description: 「API Key」页创建的密钥（cm- 前缀，明文仅创建时返回一次；停用/删除即失效）
  schemas:
    Error:
      type: object
      description: 统一错误体（非 2xx 响应一律此形态）
      properties:
        error:
          type: object
          properties:
            type:
              type: string
              description: |
                错误类型：invalid_request=参数/资源错误（400/404/409）、
                unauthorized=未认证或凭据无效（401）、forbidden=来源 IP 不在管理白名单（403）、
                quota_exhausted=额度用尽/登录限流锁定（429）、rate_limited=调用方限速（429）、
                provider_error=上游平台失败（502）、server_error=服务器内部错误（500）
            message:
              type: string
              description: 人类可读中文文案；内部错误只返回通用文案
      example:
        error: {type: invalid_request, message: 请求体格式错误}
    AuditLog:
      type: object
      description: |
        管理操作审计日志行（E4）。action 为前缀枚举：channel_*（渠道）、key_*（API Key）、
        user_*（账号）、settings_*（系统设置）、purge_*（日志清理）、backup_*（备份）；
        detail/target 仅含字段名、计数与资源名等非敏感摘要。
      properties:
        id:
          type: integer
          description: 审计行 id（自增，与 created_at 单调一致）
        username:
          type: string
          description: 操作者（会话用户名）
        action:
          type: string
          description: 动作枚举：channel_create/channel_update/channel_delete/channel_status/channel_duplicate、
            key_create/key_update/key_delete、user_create/user_reset_password/user_delete、
            settings_update、purge_logs、backup_create/backup_delete
        target:
          type: string
          description: 目标摘要，形如 "channel#3 name=示例渠道"
        detail:
          type: string
          description: 补充摘要（≤500 字符截断；settings_update 为变更字段名清单，不含任何字段值）
        ip:
          type: string
          description: 操作来源 IP（c.ClientIP()，反代部署依赖可信代理配置）
        created_at:
          type: string
          format: date-time
      example:
        id: 9
        username: admin
        action: settings_update
        target: settings#1
        detail: "fields=rotation,log_retention_days"
        ip: "192.168.1.10"
        created_at: "2026-11-12T08:00:00+08:00"
  responses:
    BadRequest:
      description: 请求参数错误（400）
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
          example:
            error: {type: invalid_request, message: 请求体格式错误}
    UnauthorizedSession:
      description: 未登录或会话失效（401）；同时 Set-Cookie 清除会话
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
          example:
            error: {type: unauthorized, message: 未登录或会话已过期}
    UnauthorizedApiKey:
      description: 缺少 Bearer ApiKey 或 ApiKey 无效/停用（401）
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
          example:
            error: {type: unauthorized, message: ApiKey 无效或已停用}
    IdempotencyConflict:
      description: 相同 Idempotency-Key 的请求正在处理中（409，稍后重试可取回结果）
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
          example:
            error: {type: invalid_request, message: 相同的 Idempotency-Key 请求正在处理中}
    RateLimited:
      description: 触发限流/额度约束（429）：rate_limited=调用方限速（rate_per_sec）、quota_exhausted=调用方日配额或登录失败锁定
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
          example:
            error: {type: rate_limited, message: 请求过于频繁（rate_per_sec 限制）}
    ProviderError:
      description: 轮换候选渠道全部尝试失败（502，发送终态）
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
          example:
            error: {type: provider_error, message: 已尝试 2 个渠道均发送失败：535 Authentication failed}
    ServerError:
      description: 服务器内部错误（500，详情仅入服务端日志）
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
          example:
            error: {type: server_error, message: 服务器内部错误}
