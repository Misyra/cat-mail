                name: 主渠道
                provider: smtp
                status: 0
                priority: 5
                smtp_pass: "****"
                health: null
        "400":
          description: 校验失败（clear_secrets 未知字段/渠道参数非法/重名等）
          content:
            application/json:
              example:
                error: {type: invalid_request, message: "clear_secrets 含未知字段：foo"}
        "401":
          $ref: "#/components/responses/UnauthorizedSession"
        "404":
          description: 渠道不存在
          content:
            application/json:
              example:
                error: {type: invalid_request, message: 渠道不存在}
    delete:
      operationId: deleteChannel
      tags: [渠道]
      summary: 删除渠道
      description: 删除指定渠道；历史发送日志保留渠道名冗余快照，不受影响。
