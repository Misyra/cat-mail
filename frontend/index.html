<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230ea5e9' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 5c.67 0 1.35.09 2 .26 1.78-2 5.03-2.84 6.42-2.26 1.4.58-.42 7-.42 7 .57 1.07 1 2.24 1 3.44C21 17.9 16.97 21 12 21s-9-3-9-7.56c0-1.25.5-2.4 1-3.44 0 0-1.89-6.42-.5-7 1.39-.58 4.72.23 6.5 2.23A9.04 9.04 0 0 1 12 5Z'/%3E%3Cpath d='M8 14v.5'/%3E%3Cpath d='M16 14v.5'/%3E%3Cpath d='M11.25 16.25h1.5L12 17l-.75-.75Z'/%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta id="theme-color-meta" name="theme-color" content="#f1f5f9" />
    <meta name="robots" content="noindex, nofollow" />
    <title>猫邮管理后台</title>
    <script>
      // 首屏防闪烁：CSS 加载前按 localStorage（light/glass/dark/system 四态）设置 html.dark
      // 与 html.glass；glass 档的明暗基色取 catmail-theme-base 最近记录，无记录跟随系统
      try {
        var stored = localStorage.getItem('catmail-theme')
        var dark
        if (stored === 'dark') {
          dark = true
        } else if (stored === 'light') {
          dark = false
        } else if (stored === 'glass') {
          var base = localStorage.getItem('catmail-theme-base')
          dark =
            base === 'dark' ||
            (base !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        } else {
          // system 或无记录：跟随系统 prefers-color-scheme
          dark = window.matchMedia('(prefers-color-scheme: dark)').matches
        }
        if (dark) document.documentElement.classList.add('dark')
        if (stored === 'glass') document.documentElement.classList.add('glass')
        // 同步 theme-color（移动端浏览器 UI 跟随主题，与 theme.ts applyTheme 的取值一致）
        document.getElementById('theme-color-meta')?.setAttribute('content', dark ? '#020617' : '#f1f5f9')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
