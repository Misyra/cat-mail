name: "Bug 报告"
description: "反馈使用中遇到的问题（安全漏洞请勿使用此表单，走 SECURITY.md 私密披露）"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈，请先确认三点：

        1. 仅维护最新版本——请先升级到最新发布版（首个 tag 发布前为 `main` 最新提交），确认问题仍然存在；
        2. **安全漏洞请勿走公开 issue**，请通过仓库 Security 标签页的 Private Vulnerability Reporting 私密披露（流程见 [SECURITY.md](../../blob/main/SECURITY.md)）；
        3. **任何日志、截图、配置片段请先脱敏**：API Key、平台 Secret、SMTP 凭据、管理员会话 token、TOTP 恢复码、邮箱地址、发件域名等一律不要出现真实值（凭据可只留短前缀 + 长度）。

  - type: input
    id: version
    attributes:
      label: "版本号"
      description: "版本 tag、Docker 镜像 tag 或 commit SHA；仓库尚未打正式 tag，填你拉取代码的 commit SHA 即可"
      placeholder: "例如：v1.0.0 / main 分支 abc1234"
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: "部署方式"
      options:
        - "Docker / docker-compose"
        - "二进制"
        - "源码自编译"
        - "其他（请在复现步骤中说明）"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: "操作系统"
      options:
        - "Linux"
        - "macOS"
        - "Windows"
        - "其他（请在复现步骤中说明）"
    validations:
      required: true

  - type: dropdown
    id: database
    attributes:
      label: "数据库"
      options:
        - "SQLite（默认）"
        - "PostgreSQL"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "复现步骤"
      description: "从部署到触发问题的完整步骤；涉及具体平台行为时注明是哪家渠道（Resend/Brevo/Mailjet/SMTP2GO/Mailgun/SMTP 等）"
      placeholder: |
        1. …
        2. …
        3. 触发问题
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "期望行为"
      description: "按 SPEC.md 契约（或你的合理预期）此时应该发生什么"
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: "实际行为"
      description: "实际发生了什么；如有错误码/响应体请一并附上"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: "日志片段"
      description: "服务端日志或审计页相关条目。请脱敏：API Key、SMTP 凭据、会话 token、邮箱地址、域名等不要出现真实值"
      placeholder: "粘贴脱敏后的日志（可用代码块包裹）"
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: "补充信息"
      description: "截图（UI 问题请附深/浅色主题，必要时加窄视口）、环境变量清单（脱敏）、初步排查结论等"
    validations:
      required: false
